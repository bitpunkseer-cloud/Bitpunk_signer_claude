[package]
name = "bp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bp-hal.workspace = true
bp-ui.workspace = true
bp-bitcoin.workspace = true
bp-crypto.workspace = true
bp-qr.workspace = true

[dev-dependencies]
# Flow tests fail when any screen's text overflows (see bp-ui layout-check).
bp-ui = { workspace = true, features = ["layout-check"] }
# Test-only QR decoders for the scan bench (never linked into firmware).
rqrr = "0.8"
rxing = { version = "=0.9.3", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }
# Test-only reference for building and checking PSBTs in flow tests.
bitcoin = { version = "0.32", features = ["secp-recovery"] }
