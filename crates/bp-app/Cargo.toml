[package]
name = "bp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bp-hal.workspace = true
bp-ui.workspace = true
bp-bitcoin.workspace = true
bp-crypto.workspace = true
