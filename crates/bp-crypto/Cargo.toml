[package]
name = "bp-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[dev-dependencies]
sha2 = "0.10.8"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
ripemd = "0.1.3"
secp256k1 = { version = "0.29", features = ["recovery"] }
# M10: reference crates for differential tests only
blake2 = "0.10.6"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
# M10-8: SCP03 (AES-128, AES-CMAC)
aes_ref = { package = "aes", version = "0.8.4" }
cmac_ref = { package = "cmac", version = "0.7.2" }
