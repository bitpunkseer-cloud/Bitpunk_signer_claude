[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/bitpunkseer-cloud/Bitpunk_signer_claude"
rust-version = "1.80"

[workspace.dependencies]
bp-crypto = { path = "crates/bp-crypto" }
bp-bitcoin = { path = "crates/bp-bitcoin" }
bp-qr = { path = "crates/bp-qr" }
bp-hal = { path = "crates/bp-hal" }
bp-ui = { path = "crates/bp-ui" }
bp-app = { path = "crates/bp-app" }
bp-fat = { path = "crates/bp-fat" }
bp-se050 = { path = "crates/bp-se050" }
bp-backup = { path = "crates/bp-backup" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

# Test-only QR decoders used by the scan bench run optimised even in
# debug test builds (keeps `cargo test` fast).
[profile.dev.package.rqrr]
opt-level = 3
# Elliptic-curve arithmetic runs optimised in test builds too (address
# searches and signing tests derive thousands of keys).
[profile.dev.package.bp-crypto]
opt-level = 3
[profile.dev.package.rxing]
opt-level = 3
