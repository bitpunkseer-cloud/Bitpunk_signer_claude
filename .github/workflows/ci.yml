name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Fetch Coldcard test PSBTs (test-only, not stored)
        run: ./tools/fetch_coldcard_psbts.sh
      - name: Test
        run: cargo test --all
      - name: no_std build (Cortex-M)
        run: cargo build --target thumbv7em-none-eabihf -p bp-crypto -p bp-bitcoin -p bp-qr -p bp-hal -p bp-ui -p bp-app

  simulator:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build simulator
        run: ./sim/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy-pages:
    needs: simulator
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
