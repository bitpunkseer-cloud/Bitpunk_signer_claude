name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the M9 logic freeze compares with the M8 commit
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: M9 logic freeze (core crates unchanged since M8)
        run: ./tools/check_freeze.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Fetch Coldcard test PSBTs (test-only, not stored)
        run: ./tools/fetch_coldcard_psbts.sh
      - name: Install dosfstools (test-only FAT reference)
        run: sudo apt-get update -q && sudo apt-get install -y -q dosfstools
      - name: Test
        run: cargo test --all
      - name: no_std build (Cortex-M7, thumbv7em)
        run: cargo build --target thumbv7em-none-eabihf -p bp-crypto -p bp-bitcoin -p bp-qr -p bp-hal -p bp-ui -p bp-app -p bp-fat
      - name: no_std build (Cortex-M55/M33, thumbv8m.main; STM32N6570-DK)
        run: cargo build --target thumbv8m.main-none-eabihf -p bp-crypto -p bp-bitcoin -p bp-qr -p bp-hal -p bp-ui -p bp-app -p bp-fat

  simulator:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build simulator
        run: ./sim/build.sh
      - name: Simulator end-to-end (Playwright, Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node sim/e2e/smoke.js dist/simulator.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy-pages:
    needs: simulator
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
